name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: login-backendts/package-lock.json
      - run: npm ci
        working-directory: login-backendts
      - run: npm run lint
        working-directory: login-backendts
      - run: npm run format:check
        working-directory: login-backendts
      - run: npm test
        working-directory: login-backendts
      - run: npm run build
        working-directory: login-backendts
